<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Excel File</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif, sans-serif;
            text-align: center;
            background-color: beige;
            padding-top: 80px;
        }
        h1 {
            padding: 10px 70px;
            color: #333333;
            margin-top: 40px;
        }
        .upload-form {
            margin-top: 49px;
            padding: 43px;
            background-color: rgb(255, 255, 255);
            border-radius: 24px;
            border: black;
            display: inline-block;
        }
        .upload-btn {
            padding: 14px 96px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            background: linear-gradient(to bottom, #337ab7, #214f77);
            border: none;
            border-radius: 24px;
            cursor: pointer;
        }
        .upload-btn:hover {
            background: linear-gradient(to bottom, #255b8a, #153959);
        }
        .file-input {
            display: none;
        }
        .file-label {
            display: inline-block;
            padding: 6px 12px;
            background: linear-gradient(to bottom, #559fdf, #425e77);
            color: #ffffff;
            border-radius: 24px;
            cursor: pointer;
        }

        .file-label:hover {
            background: linear-gradient(to bottom, #2d6fa8, #1b486f);
        }
        .file-name {
            display: inline-block;
            margin-left: 30px;
            font-style: italic;
            color: #888888;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-top: 100px;
        }
        .upload-btn {
            margin-top: 0;
        }
        .pdf-btn {
            background: linear-gradient(to bottom, #c0392b, #922b21);
        }
        .pdf-btn:hover {
            background: linear-gradient(to bottom, #a93226, #7b241c);
        }
        .error-message {
            margin: 24px auto 0;
            max-width: 520px;
            padding: 12px 20px;
            color: #7f1d1d;
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <h1>Hi Daddy!!!!</h1>
    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}
    <form class="upload-form" method="POST" enctype="multipart/form-data">
        <label class="file-label" for="file-input">Choose file</label>
        <input id="file-input" class="file-input" type="file" name="file" accept=".xlsx, .xls" required>
        <span class="file-name">No file chosen</span>
        <div class="action-buttons">
            <button class="upload-btn" type="submit" name="output_format" value="excel">Download Excel</button>
            <button class="upload-btn pdf-btn" type="submit" name="output_format" value="pdf">Download PDF</button>
        </div>
    </form>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileName = document.querySelector('.file-name');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;
            } else {
                fileName.textContent = 'No file chosen';
            }
        });
    </script>
</body>
</html>
